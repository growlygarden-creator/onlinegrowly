services:
  - type: web
    name: growly-garden
    runtime: python
    plan: starter
    buildCommand: cd frontend && npm ci && npm run build && cd .. && pip install -r requirements.txt
    startCommand: 'gunicorn main:app --bind 0.0.0.0:$PORT --worker-class uvicorn.workers.UvicornWorker --workers ${WEB_CONCURRENCY:-1} --max-requests ${MAX_WORKER_REQUESTS:-750} --max-requests-jitter ${MAX_WORKER_REQUESTS_JITTER:-100} --timeout 60 --graceful-timeout 30'
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROWLY_DATA_DIR
        value: /var/data
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MAX_WORKER_REQUESTS
        value: "750"
      - key: MAX_WORKER_REQUESTS_JITTER
        value: "100"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: DEBUG_MEMORY
        value: "false"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: DEFAULT_VIEWER_USERNAME
        sync: false
      - key: DEFAULT_VIEWER_PASSWORD
        sync: false
      - key: SETTINGS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_SAME_SITE
        value: none
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: NATIVE_APP_ORIGINS
        value: capacitor://localhost,http://localhost,http://127.0.0.1,ionic://localhost
      - key: APP_PUBLIC_URL
        value: https://onlinegrowly.onrender.com/app
      - key: ACTIVE_FIRMWARE_VERSION
        sync: false
      - key: ACTIVE_FIRMWARE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SUPABASE_REST_ENDPOINT
        sync: false
      - key: SUPABASE_API_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SENSOR_SYNC_ENABLED
        value: "true"
      - key: SUPABASE_SENSOR_READ_ENABLED
        value: "true"
      - key: SUPABASE_STATUS_SYNC_MIN_INTERVAL_SECONDS
        value: "1800"
      - key: DEVICE_CONFIG_CACHE_TTL_SECONDS
        value: "300"
      - key: MEMORY_TRIM_INTERVAL_SECONDS
        value: "60"
    disk:
      name: growly-data
      mountPath: /var/data
      sizeGB: 1
