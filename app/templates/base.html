<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Growly Garden{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v=20260423-ui-v2">
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="app-shell">
        <header class="page-topbar">
            <a class="landing-brand" href="/" aria-label="Growly Garden">
                <img class="logo-mark small" src="{{ url_for('static', path='logo.png') }}" alt="Growly Garden logo">
                <span>Growly Garden</span>
            </a>

            {% if current_username|default('') %}
            <nav class="page-nav" aria-label="Hovednavigasjon">
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Hjem</a>
                <a href="/monitor" class="{% if request.url.path == '/monitor' %}active{% endif %}">Monitor</a>
                <a href="/drivhus-test" class="{% if request.url.path == '/drivhus-test' %}active{% endif %}">Drivhus test</a>
                <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">{% if not current_user_is_admin %}<span class="nav-lock" aria-hidden="true">🔒</span>{% endif %}Innstillinger</a>
                <a href="/users" class="{% if request.url.path == '/users' %}active{% endif %}">{% if not current_user_is_admin %}<span class="nav-lock" aria-hidden="true">🔒</span>{% endif %}Brukere</a>
                <form method="post" action="/logout" class="page-nav-form">
                    <button class="page-nav-button" type="submit">Logg ut</button>
                </form>
            </nav>
            {% else %}
            <nav class="page-nav" aria-label="Autentisering">
                <a href="/login" class="{% if request.url.path == '/login' %}active{% endif %}">Logg inn</a>
                <a href="/register" class="{% if request.url.path == '/register' %}active{% endif %}">Registrer</a>
            </nav>
            {% endif %}
        </header>

        {% block content %}{% endblock %}
    </div>
</body>
</html>
